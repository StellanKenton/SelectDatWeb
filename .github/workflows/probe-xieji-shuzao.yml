name: Probe Xieji Shuzao
on:
  push:
    branches:
      - probe/calendar-rule
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt cnlunar
      - run: python tools/probe_xieji_shuzao.py
