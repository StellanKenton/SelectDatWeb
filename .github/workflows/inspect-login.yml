name: Inspect reference login
on:
  push:
    branches: [probe/reference-site]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect login form
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A "Mozilla/5.0" \
            "http://zeridashi.top/zeridashi/index-web/login.php?id=17782134566" -o login.html
          echo "=== FORM/INPUT/AJAX ==="
          grep -niE '<form|<input|<script|ajax|post|login|password|passwd|pwd|mima|密码|Action|url|submit' login.html | head -n 400 || true
