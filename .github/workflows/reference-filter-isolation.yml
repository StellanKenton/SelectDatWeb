name: Reference Filter Isolation

on:
  push:
    branches:
      - probe/reference-filter-isolation

jobs:
  isolate:
    runs-on: ubuntu-latest
    env:
      ZERIDASHI_PHONE: ${{ secrets.ZERIDASHI_PHONE }}
      ZERIDASHI_PASSWORD: ${{ secrets.ZERIDASHI_PASSWORD }}
      ZERIDASHI_REQUEST_INTERVAL: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt selenium
      - name: Isolate default sha filters
        run: python tools/isolate_reference_filters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-filter-isolation
          path: reference_filter_isolation/
          if-no-files-found: warn
