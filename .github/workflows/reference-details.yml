name: Reference Detail Capture

on:
  push:
    branches:
      - probe/reference-details

jobs:
  capture-details:
    runs-on: ubuntu-latest
    env:
      ZERIDASHI_PHONE: ${{ secrets.ZERIDASHI_PHONE }}
      ZERIDASHI_PASSWORD: ${{ secrets.ZERIDASHI_PASSWORD }}
      ZERIDASHI_REQUEST_INTERVAL: "2.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Capture reference sha pages
        run: python tools/capture_reference_sha_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-sha-pages
          path: reference_sha_pages/
          if-no-files-found: warn
