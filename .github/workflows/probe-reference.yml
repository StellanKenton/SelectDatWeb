name: Probe reference site
on:
  push:
    branches:
      - probe/reference-site

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect reference frames
        shell: bash
        run: |
          set -e
          curl -L --max-time 30 -A "Mozilla/5.0" -c cookies.txt -b cookies.txt -o index.html "http://zeridashi.top/index-web.php?id=17782134566"
          curl -L --max-time 30 -A "Mozilla/5.0" -c cookies.txt -b cookies.txt -o toptext.html "http://zeridashi.top/zeridashi/yixue/toptext.php"
          curl -L --max-time 30 -A "Mozilla/5.0" -c cookies.txt -b cookies.txt -o topzeri.html "http://zeridashi.top/zeridashi/yixue/topzeri.php"
          curl -L --max-time 30 -A "Mozilla/5.0" -c cookies.txt -b cookies.txt -o info.html "http://zeridashi.top/zeridashi/yixue/topzeri_info.php"
          curl -L --max-time 30 -A "Mozilla/5.0" -c cookies.txt -b cookies.txt -o bottom.html "http://zeridashi.top/zeridashi/yixue/bottom.php"
          curl -L --max-time 30 -A "Mozilla/5.0" -c cookies.txt -b cookies.txt -o hidden.html "http://zeridashi.top/zeridashi/yixue/5.php"
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['index.html','toptext.html','topzeri.html','info.html','bottom.html','hidden.html']:
              p=Path(name)
              text=p.read_text('utf-8',errors='replace')
              print('\n===',name,'===')
              print('title',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:5])
              print('forms',re.findall(r'<form[^>]*>',text,re.I)[:20])
              print('inputs',re.findall(r'<input[^>]*>',text,re.I)[:80])
              print('selects',re.findall(r'<select[^>]*>',text,re.I)[:50])
              print('anchors',re.findall(r'<a[^>]+href=[\"\']([^\"\']+)',text,re.I)[:100])
              print('scripts',re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',text,re.I)[:50])
              print(text[:30000])
          PY
