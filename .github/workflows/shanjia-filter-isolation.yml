name: Shanjia Filter Isolation

on:
  push:
    branches:
      - probe/shanjia-filter-isolation

jobs:
  isolate:
    runs-on: ubuntu-latest
    env:
      ZERIDASHI_PHONE: ${{ secrets.ZERIDASHI_PHONE }}
      ZERIDASHI_PASSWORD: ${{ secrets.ZERIDASHI_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt selenium
      - name: Run focused reference isolation
        run: python tools/isolate_shanjia_filters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shanjia-filter-isolation
          path: reference_isolation/
          if-no-files-found: warn
