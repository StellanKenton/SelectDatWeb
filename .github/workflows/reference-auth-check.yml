name: Reference Filter Isolation

on:
  push:
    branches:
      - probe/reference-auth

concurrency:
  group: zeridashi-reference-auth
  cancel-in-progress: true

jobs:
  isolate:
    runs-on: ubuntu-latest
    env:
      ZERIDASHI_PHONE: ${{ secrets.ZERIDASHI_PHONE }}
      ZERIDASHI_PASSWORD: ${{ secrets.ZERIDASHI_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main_src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt selenium
      - name: Compare fixed reference baseline
        run: python tools/local_reference_counts.py
      - name: Compare lunar-python yiji names
        run: python tools/compare_dayji_names.py
      - name: Ablate local sha rules
        run: python tools/local_rule_ablation.py
      - name: Capture original sha explanations
        continue-on-error: true
        run: python tools/capture_sha_explanations.py
      - name: Isolate reference sha rules
        run: python tools/isolate_reference_filters.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-isolation
          path: |
            reference_isolation/
            reference_explanations/
          if-no-files-found: warn
